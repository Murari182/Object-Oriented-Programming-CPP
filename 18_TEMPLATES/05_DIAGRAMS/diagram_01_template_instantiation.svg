<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="740" height="200" font-family="monospace, sans-serif">
  <rect width="740" height="200" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="370" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Compile-Time Template Instantiation</text>
  <rect x="40" y="65" width="240" height="100" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Blueprint</text>
  <text x="160" y="122" text-anchor="middle" font-size="12">template &lt;typename T&gt;</text>
  <text x="160" y="144" text-anchor="middle" font-size="12">T get_max(T a, T b)</text>
  <rect x="410" y="55" width="290" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">int get_max&lt;int&gt;(int, int)</text>
  <rect x="410" y="120" width="290" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="555" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">double get_max&lt;double&gt;(double, double)</text>
</svg>
