<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="monospace, sans-serif">
  <rect width="760" height="270" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">The Right-to-Left Reading Rule for const and Pointers</text>

  <rect x="40" y="65" width="680" height="50" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="60" y="95" font-size="14" font-weight="bold" fill="#0c4a6e">const int * p</text>
  <text x="270" y="95" font-size="13" fill="#0f172a">p = &amp;y (ALLOWED)   |   *p = 99 (COMPILE ERROR: data is const)</text>

  <rect x="40" y="130" width="680" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="160" font-size="14" font-weight="bold" fill="#92400e">int * const p</text>
  <text x="270" y="160" font-size="13" fill="#0f172a">p = &amp;y (COMPILE ERROR) | *p = 99 (ALLOWED: data is mutable)</text>

  <rect x="40" y="195" width="680" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="225" font-size="14" font-weight="bold" fill="#991b1b">const int * const p</text>
  <text x="270" y="225" font-size="13" fill="#0f172a">p = &amp;y (COMPILE ERROR) | *p = 99 (COMPILE ERROR: both locked)</text>
</svg>
