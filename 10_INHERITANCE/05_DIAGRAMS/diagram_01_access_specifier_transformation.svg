<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" font-family="monospace, sans-serif">
  <rect width="800" height="310" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Inheritance Access Specifier Transformation Matrix</text>

  <!-- Header -->
  <rect x="40" y="55" width="720" height="40" fill="#1e293b"/>
  <text x="60" y="80" font-size="13" font-weight="bold" fill="#ffffff">Base Member</text>
  <text x="230" y="80" font-size="13" font-weight="bold" fill="#ffffff">: public Base</text>
  <text x="415" y="80" font-size="13" font-weight="bold" fill="#ffffff">: protected Base</text>
  <text x="610" y="80" font-size="13" font-weight="bold" fill="#ffffff">: private Base</text>

  <!-- Row 1: public -->
  <rect x="40" y="95" width="720" height="60" fill="#dcfce7" stroke="#86efac"/>
  <text x="60" y="130" font-size="14" font-weight="bold" fill="#14532d">public</text>
  <text x="230" y="130" font-size="14" font-weight="bold" fill="#15803d">public</text>
  <text x="415" y="130" font-size="14" font-weight="bold" fill="#b45309">protected</text>
  <text x="610" y="130" font-size="14" font-weight="bold" fill="#b91c1c">private</text>

  <!-- Row 2: protected -->
  <rect x="40" y="155" width="720" height="60" fill="#fef3c7" stroke="#fde047"/>
  <text x="60" y="190" font-size="14" font-weight="bold" fill="#92400e">protected</text>
  <text x="230" y="190" font-size="14" font-weight="bold" fill="#b45309">protected</text>
  <text x="415" y="190" font-size="14" font-weight="bold" fill="#b45309">protected</text>
  <text x="610" y="190" font-size="14" font-weight="bold" fill="#b91c1c">private</text>

  <!-- Row 3: private -->
  <rect x="40" y="215" width="720" height="60" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="60" y="250" font-size="14" font-weight="bold" fill="#991b1b">private</text>
  <text x="230" y="250" font-size="13" fill="#991b1b">Inaccessible</text>
  <text x="415" y="250" font-size="13" fill="#991b1b">Inaccessible</text>
  <text x="610" y="250" font-size="13" fill="#991b1b">Inaccessible</text>
</svg>
