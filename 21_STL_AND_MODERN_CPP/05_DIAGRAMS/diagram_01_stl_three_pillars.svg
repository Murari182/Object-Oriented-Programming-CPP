<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 190" width="740" height="190" font-family="monospace, sans-serif">
  <rect width="740" height="190" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="370" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">The Three Core Components of the C++ STL</text>
  <rect x="35" y="60" width="210" height="100" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">1. Containers</text>
  <text x="140" y="120" text-anchor="middle" font-size="12">vector, array, map, set</text>
  <rect x="265" y="60" width="210" height="100" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="370" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">2. Iterators</text>
  <text x="370" y="120" text-anchor="middle" font-size="12">begin(), end()</text>
  <rect x="495" y="60" width="210" height="100" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">3. Algorithms</text>
  <text x="600" y="120" text-anchor="middle" font-size="12">sort(), find(), count()</text>
</svg>
