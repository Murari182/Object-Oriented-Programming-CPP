<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family="monospace, sans-serif">
  <rect width="800" height="260" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Double Indirection (Pointer to Pointer): int x = 50; int* p = &amp;x; int** pp = &amp;p;</text>

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- pp box -->
  <rect x="40" y="80" width="200" height="110" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="140" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#4338ca">int** pp</text>
  <text x="140" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#312e81">0x2000</text>
  <text x="140" y="215" text-anchor="middle" font-size="12" fill="#475569">&amp;pp = 0x3000</text>

  <line x1="240" y1="135" x2="295" y2="135" stroke="#4f46e5" stroke-width="3" marker-end="url(#arr2)"/>
  <text x="268" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#4f46e5">*pp</text>

  <!-- p box -->
  <rect x="300" y="80" width="200" height="110" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="400" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">int* p (*pp)</text>
  <text x="400" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#0c4a6e">0x1000</text>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#475569">&amp;p = 0x2000</text>

  <line x1="500" y1="135" x2="555" y2="135" stroke="#4f46e5" stroke-width="3" marker-end="url(#arr2)"/>
  <text x="528" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#4f46e5">**pp</text>

  <!-- x box -->
  <rect x="560" y="80" width="200" height="110" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">int x (*p / **pp)</text>
  <text x="660" y="135" text-anchor="middle" font-size="22" font-weight="bold" fill="#14532d">50</text>
  <text x="660" y="215" text-anchor="middle" font-size="12" fill="#475569">&amp;x = 0x1000</text>
</svg>
