<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="monospace, sans-serif">
  <rect width="760" height="250" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Shallow Copy (Double Free Bug) vs. Deep Copy (Independent Heap Blocks)</text>
  <rect x="35" y="60" width="330" height="160" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Shallow Copy (Default)</text>
  <text x="55" y="120" font-size="12" fill="#0f172a">b1.ptr (0x5000) ──┐</text>
  <text x="55" y="142" font-size="12" fill="#0f172a">                  ├──&gt; Heap [ 50 ]</text>
  <text x="55" y="164" font-size="12" fill="#0f172a">b2.ptr (0x5000) ──┘</text>
  <text x="55" y="198" font-size="12" font-weight="bold" fill="#b91c1c">Both destructors delete 0x5000!</text>

  <rect x="395" y="60" width="330" height="160" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="560" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Deep Copy (Custom Copy Ctor)</text>
  <text x="415" y="120" font-size="12" fill="#0f172a">b1.ptr (0x5000) ─────&gt; Heap [ 50 ]</text>
  <text x="415" y="160" font-size="12" fill="#0f172a">b2.ptr (0x6000) ─────&gt; Heap [ 50 ]</text>
  <text x="415" y="198" font-size="12" font-weight="bold" fill="#14532d">Each object owns separate memory!</text>
</svg>
