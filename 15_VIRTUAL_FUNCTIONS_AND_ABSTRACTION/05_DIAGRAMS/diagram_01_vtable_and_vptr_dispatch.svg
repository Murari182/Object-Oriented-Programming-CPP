<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="monospace, sans-serif">
  <rect width="760" height="240" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">How vptr and vtable Dispatch Virtual Function Calls at Runtime</text>
  <rect x="40" y="65" width="180" height="120" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="130" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Base Pointer</text>
  <text x="130" y="130" text-anchor="middle" font-size="13">person* p = &amp;s;</text>
  <line x1="220" y1="125" x2="275" y2="125" stroke="#0284c7" stroke-width="3"/>
  <rect x="280" y="65" width="200" height="120" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="380" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">student Object (s)</text>
  <text x="380" y="125" text-anchor="middle" font-size="13" font-weight="bold">[ vptr ] ─────────┐</text>
  <text x="380" y="155" text-anchor="middle" font-size="13">[ roll = 101 ]    │</text>
  <rect x="520" y="65" width="210" height="120" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">student vtable</text>
  <text x="625" y="128" text-anchor="middle" font-size="12" fill="#14532d">&amp;student::introduce()</text>
  <text x="625" y="155" text-anchor="middle" font-size="12" fill="#14532d">&amp;student::~student()</text>
</svg>
