<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="monospace, sans-serif">
  <rect width="760" height="240" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="380" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Object Layout: Per-Object Data Members vs. Shared Code &amp; Static Data</text>
  <rect x="40" y="65" width="200" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Object p1 (Stack)</text>
  <text x="140" y="118" text-anchor="middle" font-size="13">p1.age = 20</text>
  <rect x="40" y="150" width="200" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#0369a1">Object p2 (Stack)</text>
  <text x="140" y="203" text-anchor="middle" font-size="13">p2.age = 22</text>

  <rect x="320" y="65" width="400" height="155" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Shared Across All Objects of class person</text>
  <text x="345" y="130" font-size="13" fill="#0f172a">• Code Segment: person::input(this, a)</text>
  <text x="345" y="158" font-size="13" fill="#0f172a">• Code Segment: person::display(this)</text>
  <text x="345" y="186" font-size="13" fill="#0f172a">• Static Segment: static data members</text>
</svg>
