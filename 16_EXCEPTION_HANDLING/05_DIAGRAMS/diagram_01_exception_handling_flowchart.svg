<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" font-family="monospace, sans-serif">
  <rect width="800" height="280" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Exception Handling Control Flow: try -&gt; throw -&gt; Stack Unwinding -&gt; catch</text>

  <defs>
    <marker id="arrEx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect x="35" y="75" width="160" height="120" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="115" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">1. try Block</text>
  <text x="115" y="135" text-anchor="middle" font-size="12" fill="#0f172a">Checks condition</text>
  <text x="115" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">throw ex;</text>

  <line x1="195" y1="135" x2="235" y2="135" stroke="#0284c7" stroke-width="3" marker-end="url(#arrEx)"/>

  <rect x="240" y="75" width="190" height="120" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="335" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">2. Stack Unwinding</text>
  <text x="335" y="135" text-anchor="middle" font-size="12" fill="#0f172a">Destroys local stack</text>
  <text x="335" y="158" text-anchor="middle" font-size="12" fill="#0f172a">objects in LIFO order</text>

  <line x1="430" y1="135" x2="470" y2="135" stroke="#0284c7" stroke-width="3" marker-end="url(#arrEx)"/>

  <rect x="475" y="75" width="290" height="120" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">3. Matching Handler?</text>
  <text x="490" y="132" font-size="12" fill="#14532d">• YES: Execute catch(const T&amp;)</text>
  <text x="490" y="154" font-size="12" fill="#14532d">  and resume after catch block.</text>
  <text x="490" y="176" font-size="12" fill="#991b1b">• NO: Call std::terminate()!</text>
</svg>
