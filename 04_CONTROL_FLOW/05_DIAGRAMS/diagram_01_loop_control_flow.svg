<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" width="740" height="200" font-family="monospace, sans-serif">
  <rect width="740" height="200" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="370" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Entry-Controlled (while / for) vs. Exit-Controlled (do-while) Loops</text>
  <rect x="40" y="60" width="320" height="110" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="200" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#0369a1">while / for (Entry-Controlled)</text>
  <text x="60" y="118" font-size="12">1. Check Condition FIRST</text>
  <text x="60" y="142" font-size="12">2. Min executions: 0 times</text>
  <rect x="380" y="60" width="320" height="110" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="540" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">do-while (Exit-Controlled)</text>
  <text x="400" y="118" font-size="12">1. Execute Body FIRST</text>
  <text x="400" y="142" font-size="12">2. Min executions: 1 time</text>
</svg>
