<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="monospace, sans-serif">
  <rect width="820" height="340" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Mandatory Classroom Examples 1 &amp; 2: Inside Derived vs. Outside Derived (main)</text>

  <!-- Base class person / super -->
  <rect x="40" y="60" width="230" height="110" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Base: person / super</text>
  <text x="60" y="112" font-size="13" fill="#0f172a">public:</text>
  <text x="75" y="134" font-size="13" font-weight="bold" fill="#14532d">int input(int a)</text>
  <text x="75" y="154" font-size="13" font-weight="bold" fill="#14532d">void show()</text>

  <!-- Derived class student / sub -->
  <rect x="310" y="60" width="250" height="240" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="435" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Derived: : protected Base</text>
  <text x="330" y="115" font-size="12" font-weight="bold" fill="#b45309">protected (Transformed!):</text>
  <text x="345" y="138" font-size="13" fill="#78350f">input(int a)</text>
  <text x="345" y="158" font-size="13" fill="#78350f">show()</text>
  <line x1="325" y1="180" x2="545" y2="180" stroke="#d97706" stroke-dasharray="4"/>
  <text x="330" y="205" font-size="12" font-weight="bold" fill="#15803d">public (Inside Derived):</text>
  <text x="345" y="230" font-size="13" font-weight="bold" fill="#14532d">void display() {</text>
  <text x="360" y="252" font-size="12" fill="#15803d">input(30); // ALLOWED!</text>
  <text x="345" y="274" font-size="13" font-weight="bold" fill="#14532d">}</text>

  <!-- Outside main() -->
  <rect x="595" y="60" width="195" height="240" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="692" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Outside: int main()</text>
  <text x="610" y="125" font-size="12" font-weight="bold" fill="#b91c1c">obj.show();</text>
  <text x="610" y="145" font-size="11" fill="#991b1b">COMPILE ERROR!</text>
  <text x="610" y="175" font-size="12" font-weight="bold" fill="#b91c1c">s.input(40);</text>
  <text x="610" y="195" font-size="11" fill="#991b1b">COMPILE ERROR!</text>
  <line x1="605" y1="215" x2="775" y2="215" stroke="#dc2626" stroke-dasharray="4"/>
  <text x="610" y="245" font-size="12" font-weight="bold" fill="#15803d">s.display();</text>
  <text x="610" y="265" font-size="11" fill="#15803d">ALLOWED (public)!</text>
</svg>
